<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="GovDeals">
  <!-- Classic GovDeals lockup: capitol building watermark behind "Gov" -->
  <g fill="#7eb6d9" opacity="0.55" transform="translate(8,18) scale(1.05)">
    <!-- dome -->
    <path d="M78 52c0-22 18-40 40-40s40 18 40 40h-12c0-15-12-28-28-28s-28 13-28 28z"/>
    <rect x="110" y="28" width="16" height="10" rx="2"/>
    <rect x="114" y="18" width="8" height="12" rx="1"/>
    <!-- pediment -->
    <polygon points="48,58 118,42 188,58"/>
    <rect x="48" y="56" width="140" height="8"/>
    <!-- columns -->
    <rect x="58" y="64" width="10" height="52"/>
    <rect x="78" y="64" width="10" height="52"/>
    <rect x="98" y="64" width="10" height="52"/>
    <rect x="118" y="64" width="10" height="52"/>
    <rect x="138" y="64" width="10" height="52"/>
    <rect x="158" y="64" width="10" height="52"/>
    <!-- base -->
    <rect x="48" y="116" width="140" height="10"/>
    <rect x="40" y="126" width="156" height="8"/>
  </g>
  <text
    x="24"
    y="108"
    font-family="Arial, Helvetica, 'Segoe UI', sans-serif"
