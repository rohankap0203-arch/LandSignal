[project]
name = "landsignal-api"
version = "0.1.0"
description = "LandSignal control-plane API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.38",
  "asyncpg>=0.30.0",
  "geoalchemy2>=0.17.0",
  "shapely>=2.0.7",
  "redis>=5.2.0",
  "orjson>=3.10.0",
  "structlog>=25.1.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
